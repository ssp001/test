# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r reqirement.txt
          pip install --upgrade pip

      - name: test application with pytest
        env:
          URL: ${{ secrets.URL }}
          GROQ_API_KEY: ${{secrets.GROQ_API_KEY}}
        run: |
          source .venv/bin/activate
          pytest
  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bulid Docker image and login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Bulid and push to docker hub
        run: |
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/tutor-api:latest -f docker/dockerfile
          docker push ${{secrets.DOCKERHUB_USERNAME}}/tutor-api 
